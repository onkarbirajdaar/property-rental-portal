<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top gd-navbar">
  <div class="container">
    <!-- Logo -->
    <a class="navbar-brand fw-semibold gd-logo" href="{% url 'home' %}">
      GharDekho
    </a>

    <!-- Mobile toggle -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarMenu"
      aria-controls="navbarMenu"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar items -->
    <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-2 me-2">
          <span class="gd-avatar">{{ user.username|slice:":1"|upper }}</span>
          <span class="gd-hi-text d-none d-lg-inline">Hi, {{ user.username }}</span>
        </div>
        <a href="{% url 'dashboard' %}" class="btn gd-btn-ghost">
          <i class="bi bi-grid"></i> Dashboard
        </a>
        <a href="{% url 'my_wishlist' %}" class="btn gd-btn-ghost">
          <i class="bi bi-bookmark-heart"></i> My Wishlist
        </a>
        <a href="{% url 'profile' %}" class="btn gd-btn-ghost">
          <i class="bi bi-person"></i> Profile
        </a>
        {% if user.profile.role == "owner" %}
        <a href="{% url 'add_property' %}" class="btn gd-btn-primary">
          <i class="bi bi-plus-lg"></i> Post Property
        </a>
        {% endif %}
        <form method="POST" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn gd-btn-logout">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
        </form>
        {% else %}
        <a href="{% url 'login' %}" class="btn gd-btn-ghost">Login</a>
        <a href="{% url 'register' %}" class="btn gd-btn-primary">Register</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
